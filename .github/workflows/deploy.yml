name: Lab 06 - Build et Deploy

on:
  push:
    branches:
      - main

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'   
               
      - name: Installer les dependances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Verifier dist
        run: ls -lah dist/

      - name: Conserver artifact dist
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 7

  deploy-surge:
    name: Deployer sur Surge
    runs-on: ubuntu-latest
    needs: build-site
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recuperer artifact dist
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/

      - name: Installer Surge
        run: npm install --global surge

      - name: Deployer le site
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_DOMAIN: ${{ vars.SURGE_DOMAIN }}
        run: surge ./dist "$SURGE_DOMAIN" --token "$SURGE_TOKEN"
